{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block page_title %}Watchlist{% endblock page_title %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="{% url 'movie:list' %}">
                <span class="brand-mark">&#9654;</span>
                <span class="brand-name">Watchlist</span>
            </a>
            <span class="header-tagline">Movies I've watched, rated and reviewed</span>
        </div>
    </header>

    <main class="container">
        {% block content %}
        {% endblock content %}
    </main>

    <footer class="site-footer">
        <div class="container">Built with Django &middot; Watchlist project</div>
    </footer>
</body>
</html>
